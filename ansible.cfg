[defaults]
# Archivo de inventario predeterminado
inventory = inventario.ini

# Desactivar verificación estricta de claves de host SSH
host_key_checking = False

# Desactivar advertencias de obsolescencia
deprecation_warnings = False

# Usuario remoto por defecto
remote_user = ansible

# Tiempo de espera para conexiones SSH (en segundos)
timeout = 30

# Número de procesos concurrentes
forks = 5

# Desactivar la creación de archivos .retry al fallar un playbook
retry_files_enabled = False

[ssh_connection]
# Ignorar advertencias y evitar agregar entradas a known_hosts
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
