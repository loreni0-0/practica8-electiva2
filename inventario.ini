# Inventario de Servidores Ubuntu para Ansible
# Conexión mediante localhost y los puertos mapeados por Docker Compose

[servidores]
server1 ansible_host=127.0.0.1 ansible_port=2201
server2 ansible_host=127.0.0.1 ansible_port=2202
server3 ansible_host=127.0.0.1 ansible_port=2203
server4 ansible_host=127.0.0.1 ansible_port=2204
server5 ansible_host=127.0.0.1 ansible_port=2205

# IPs directas de la subred interna Docker (172.20.0.0/16)
# Útiles si ejecutas Ansible dentro de la misma red bridge de Docker
# [servidores]
# server1 ansible_host=172.20.0.11 ansible_port=22
# server2 ansible_host=172.20.0.12 ansible_port=22
# server3 ansible_host=172.20.0.13 ansible_port=22
# server4 ansible_host=172.20.0.14 ansible_port=22
# server5 ansible_host=172.20.0.15 ansible_port=22

# Variables globales para todos los servidores del grupo
[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_become_password=ansible
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
